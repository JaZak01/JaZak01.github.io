<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Komunitný Kalendár</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>

<div class="container py-4" style="max-width: 880px;">

  <header class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <h1 class="h3 mb-0 fw-semibold">Náš kalendár</h1>
    <div class="d-flex align-items-center gap-3">
      <span id="status" class="text-muted small">Neprihlásený</span>
      <button id="logoutBtn" class="btn btn-outline-secondary btn-sm" hidden>Odhlásiť sa</button>
    </div>
  </header>

  <section id="authSection" class="card shadow-sm mb-4">
    <div class="card-body">
      <!-- Prepínanie medzi prihlásením a registráciou -->
      <div class="d-flex gap-2 mb-3 border-bottom pb-3">
        <button id="showLoginBtn" class="btn btn-sm btn-primary">Prihlásenie</button>
        <button id="showRegisterBtn" class="btn btn-sm btn-outline-primary">Nová registrácia</button>
      </div>

      <!-- Formulár: Prihlásenie -->
      <div id="loginForm">
        <div class="mb-2">
          <input type="email" id="loginEmail" class="form-control" placeholder="E-mail" autocomplete="username">
        </div>
        <div class="mb-3">
          <input type="password" id="loginPassword" class="form-control" placeholder="Heslo" autocomplete="current-password">
        </div>
        <button id="loginBtn" class="btn btn-primary w-100">Prihlásiť sa</button>
      </div>

      <!-- Formulár: Registrácia (predvolene skrytý) -->
      <div id="registerForm" hidden>
        <div class="mb-2">
          <input type="text" id="regUsername" class="form-control" placeholder="Tvoje meno alebo prezývka">
        </div>
        <div class="mb-2">
          <input type="email" id="regEmail" class="form-control" placeholder="E-mail" autocomplete="username">
        </div>
        <div class="row g-2 mb-3">
          <div class="col-sm-6">
            <input type="password" id="regPassword" class="form-control" placeholder="Heslo (min. 6 znakov)" autocomplete="new-password">
          </div>
          <div class="col-sm-6">
            <input type="password" id="regPasswordConfirm" class="form-control" placeholder="Zopakuj heslo" autocomplete="new-password">
          </div>
        </div>
        <button id="registerBtn" class="btn btn-primary w-100">Vytvoriť účet</button>
      </div>

      <p id="authError" class="text-danger small mt-3 mb-0" hidden></p>
    </div>
  </section>

  <section id="eventForm" class="card shadow-sm mb-4" hidden>
    <div class="card-body">
      <h2 class="h5 mb-3">Pridať udalosť</h2>
      <input type="text" id="eventName" class="form-control mb-2" placeholder="Názov udalosti (napr. Zraz komunity)">

      <div class="row g-2 mb-2">
        <div class="col-sm-6">
          <label class="form-label small text-muted mb-1">Začiatok</label>
          <input type="datetime-local" id="eventStart" class="form-control">
        </div>
        <div class="col-sm-6">
          <label class="form-label small text-muted mb-1">Koniec</label>
          <input type="datetime-local" id="eventEnd" class="form-control">
        </div>
      </div>

      <textarea id="eventDesc" class="form-control mb-3" rows="3" placeholder="Popis (kde to bude, čo si doniesť...)"></textarea>

      <div class="mb-3">
        <label class="form-label small text-muted mb-2 d-block">Tagy (čoho sa udalosť týka)</label>
        <div id="tagPicker" class="d-flex flex-wrap gap-2"></div>
      </div>

      <button id="addEventBtn" class="btn btn-primary w-100">Uložiť do kalendára</button>
    </div>
  </section>

  <div class="card shadow-sm">
    <div class="card-body">
      <div id="calendar"></div>
    </div>
  </div>

</div>

<!-- Detail udalosti (Bootstrap modal) -->
<div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zavrieť"></button>
      </div>
      <div class="modal-body">
        <p class="fw-semibold text-warning-emphasis mb-2" id="modalDate"></p>
        <p id="modalDesc" class="mb-3"></p>
        <div id="modalTags" class="mb-3"></div>
        <p class="text-muted small mb-0">Pridal(a): <span id="modalAuthor"></span></p>
      </div>
      <div class="modal-footer">
        <button id="modalDeleteBtn" class="btn btn-danger w-100" hidden>Zmazať udalosť</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
