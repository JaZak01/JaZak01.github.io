<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Komunitný Kalendár</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    input, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; }
    #eventForm { background: #f0f0f0; padding: 15px; border-radius: 8px; margin-top: 20px; }
  </style>
</head>
<body>

  <h1>Náš Kalendár</h1>
  <p id="status">Stav: Neprihlásený</p>

  <!-- Prihlasovacia časť -->
  <div id="authSection">
    <input type="email" id="email" placeholder="Tvoj E-mail">
    <input type="password" id="password" placeholder="Heslo (min. 6 znakov)">
    <button id="loginBtn">Prihlásiť sa</button>
    <button id="registerBtn">Zaregistrovať nový účet</button>
  </div>
  
  <button id="logoutBtn" style="display:none;">Odhlásiť sa</button>

  <!-- Časť na pridanie udalosti (skrytá pre neprihlásených) -->
  <div id="eventForm" style="display:none;">
    <h3>Pridať novú udalosť</h3>
    <input type="text" id="eventName" placeholder="Názov udalosti (napr. Zraz komunity)">
    <input type="date" id="eventDate">
    <button id="addEventBtn">Uložiť do kalendára</button>
  </div>

  <script type="module">
    // 1. Importy - pridali sme funkcie pre Firestore databázu
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    // 2. TVOJ CONFIG - SEM VLOŽ SVOJE ÚDAJE Z FIREBASE!
    const firebaseConfig = {
    apiKey: "AIzaSyAW1Fo3qiyJit9xUVKj4NxIF7YminZsncU",
    authDomain: "kalendar-edf3f.firebaseapp.com",
    projectId: "kalendar-edf3f",
    storageBucket: "kalendar-edf3f.firebasestorage.app",
    messagingSenderId: "604130457317",
    appId: "1:604130457317:web:6b17da98599d36c9bd860c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app); // Inicializácia databázy

    // UI Elementy
    const authSection = document.getElementById('authSection');
    const eventForm = document.getElementById('eventForm');
    const logoutBtn = document.getElementById('logoutBtn');
    const statusText = document.getElementById('status');
    const addEventBtn = document.getElementById('addEventBtn');

    // Autentifikácia (ponechaná z minula)
    document.getElementById('registerBtn').addEventListener('click', () => {
      createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
        .catch(error => alert("Chyba: " + error.message));
    });
    document.getElementById('loginBtn').addEventListener('click', () => {
      signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
        .catch(error => alert("Chyba: " + error.message));
    });
    logoutBtn.addEventListener('click', () => signOut(auth));

    // Sledovanie prihlásenia - teraz aj skrýva/zobrazuje formulár na udalosti
    onAuthStateChanged(auth, (user) => {
      if (user) {
        statusText.innerText = "Prihlásený ako: " + user.email;
        authSection.style.display = "none";
        logoutBtn.style.display = "block";
        eventForm.style.display = "block"; // Zobrazí formulár pre udalosť
      } else {
        statusText.innerText = "Stav: Neprihlásený";
        authSection.style.display = "block";
        logoutBtn.style.display = "none";
        eventForm.style.display = "none"; // Skryje formulár pre udalosť
      }
    });

    // 3. PRIDÁVANIE UDALOSTÍ DO DATABÁZY
    addEventBtn.addEventListener('click', async () => {
      const nameInput = document.getElementById('eventName').value;
      const dateInput = document.getElementById('eventDate').value;
      const currentUser = auth.currentUser;

      if (!nameInput || !dateInput) {
        alert("Prosím, vyplň názov aj dátum udalosti.");
        return;
      }

      try {
        // Zápis do kolekcie "udalosti"
        await addDoc(collection(db, "udalosti"), {
          nazov: nameInput,
          datum: dateInput,
          autor_email: currentUser.email, // Uložíme si, kto to pridal
          cas_pridania: new Date()
        });
        
        alert("Udalosť bola úspešne pridaná do databázy!");
        
        // Vyčistenie formulára po pridaní
        document.getElementById('eventName').value = "";
        document.getElementById('eventDate').value = "";
        
      } catch (error) {
        alert("Chyba pri ukladaní: " + error.message);
      }
    });
  </script>
</body>
</html>
